name: 更新 591 資料

on:
  schedule:
    # 每天台北時間 09:00（UTC 01:00）跑一次
    - cron: "0 1 * * *"
  workflow_dispatch:        # 也可以在 Actions 頁面手動觸發

permissions:
  contents: write

concurrency:
  group: update-591
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # house591.py 只用標準函式庫，不需要 pip install

      - name: 抓取 591 資料
        run: python3 house591.py

      - name: 確認有抓到東西
        run: |
          if ! ls out/591_*.csv >/dev/null 2>&1; then
            echo "沒有產生 CSV，591 可能擋了 GitHub 的 IP 或改了介面"
            exit 1
          fi
          echo "本次筆數：$(( $(wc -l < "$(ls -t out/591_*.csv | head -1)") - 1 ))"

      - name: 產生分享頁
        run: python3 make_share_page.py

      - name: 有變動才 commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/snapshot.json
          if git diff --cached --quiet; then
            echo "資料沒有變動，跳過 commit"
          else
            git commit -m "自動更新 591 資料 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
